name: Security branch checks
on:
  push:
    branches: ['security/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volteach-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: test ! -f dist/server.cjs
