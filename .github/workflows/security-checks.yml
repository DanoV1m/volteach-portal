name: Security branch checks
on:
  push:
    branches: ['security/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volteach-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: test ! -f dist/server.cjs
      - name: Local production bundle smoke test
        run: |
          NODE_ENV=production PORT=3100 node server-dist/server.cjs >/tmp/volteach-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"prompt":"test"}' http://127.0.0.1:3100/api/gemini)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/unknown)" = 404
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.0 firebase-tools@15
      - name: Test rules against disposable emulator
        run: npx firebase emulators:exec --only firestore --project demo-volteach-security "node tests/firestore-rules.mjs"
