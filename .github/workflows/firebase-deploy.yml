name: Firebase Hosting deployment

# Explicit release approval is separate from merging. Hosting alone is not sufficient for the AI backend.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY only after backend and rules are validated and release approved'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./volteach-app
        run: npm ci
      - name: Run tests
        working-directory: ./volteach-app
        run: npm test
      - name: Build frontend only
        working-directory: ./volteach-app
        run: npx --no-install vite build
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLTEACH_PORTAL }}
          projectId: volteach-portal
          channelId: live
          entryPoint: ./volteach-app
