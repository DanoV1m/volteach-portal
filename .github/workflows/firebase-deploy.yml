name: Firebase Hosting deployment

# Deploy only after an approved merge to main.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./volteach-app
        run: npm ci
      - name: Run tests
        working-directory: ./volteach-app
        run: npm test
      - name: Build frontend only
        working-directory: ./volteach-app
        run: npx --no-install vite build
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLTEACH_PORTAL }}
          projectId: volteach-portal
          channelId: live
          entryPoint: ./volteach-app
